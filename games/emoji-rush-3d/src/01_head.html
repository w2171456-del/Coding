<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140c33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Emoji Rush 3D — a 60-second 3D emoji match-3 blitz. Collect heroes, charge powers, hit BLITZ MODE.">
<title>Emoji Rush 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#221552;--bg2:#0d0a24;
  --card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.12);--line:rgba(255,255,255,.14);
  --txt:#fff;--muted:rgba(255,255,255,.62);
  --orange:#ff8a1f;--orange2:#ffb347;--pink:#ff3d81;--green:#22c55e;--green2:#4ade80;--blue:#3b82f6;--blue2:#60a5fa;--purple:#a855f7;--purple2:#c084fc;--gold:#ffd166;--gem:#67e8f9;--red:#ef4444;
  --c-common:#9aa5b1;--c-rare:#3b82f6;--c-epic:#a855f7;--c-legendary:#f59e0b;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --font:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg2);color:var(--txt);font-family:var(--font);-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;line-height:1.25}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
#app{position:fixed;inset:0;height:100vh;height:100dvh;width:100vw;overflow:hidden}
#bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -10%,var(--bg1) 0%,var(--bg2) 70%);transition:filter .6s}
#bg .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;will-change:transform;animation:drift 18s ease-in-out infinite alternate}
#bg .b1{width:60vmax;height:60vmax;left:-20vmax;top:-20vmax;background:#5b2ee6}
#bg .b2{width:50vmax;height:50vmax;right:-15vmax;top:30%;background:#e1306c;animation-delay:-6s;animation-duration:22s}
#bg .b3{width:45vmax;height:45vmax;left:20%;bottom:-25vmax;background:#0ea5e9;animation-delay:-12s;animation-duration:26s}
body.blitz #bg{filter:hue-rotate(40deg) saturate(1.4) brightness(1.15)}
body.blitz #bg .blob{animation-duration:3s}
body.reduce-motion #bg .blob{animation:none}
body.lowfx #bg .blob{filter:blur(30px);animation:none}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(8vmax,6vmax) scale(1.15)}}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui,#fx{position:absolute;inset:0}
#fx{pointer-events:none;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar)}
.screen.active{display:flex}
.hidden{display:none!important}
.emoji{font-family:var(--emoji);font-style:normal}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}
.tabular{font-variant-numeric:tabular-nums}
.grow{flex:1 1 auto;min-height:0}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.center{align-items:center;justify-content:center;text-align:center}
.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.small{font-size:12px}
.tiny{font-size:11px}
.bold{font-weight:700}
h1,h2,h3{font-weight:700;letter-spacing:.2px}
h2{font-size:22px}
h3{font-size:16px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:16px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(180deg,var(--orange2),var(--orange));box-shadow:0 5px 0 #a84600,0 10px 22px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,filter .2s;text-shadow:0 1px 0 rgba(0,0,0,.25);white-space:nowrap;-webkit-user-select:none;user-select:none}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #a84600,0 4px 12px rgba(0,0,0,.35)}
.btn:disabled{filter:grayscale(.7) brightness(.7)}
.btn.green{background:linear-gradient(180deg,#5eea8a,#16a34a);box-shadow:0 5px 0 #0c5f2b,0 10px 22px rgba(0,0,0,.35)}
.btn.green:active:not(:disabled){box-shadow:0 1px 0 #0c5f2b,0 4px 12px rgba(0,0,0,.35)}
.btn.blue{background:linear-gradient(180deg,#6cb2ff,#2563eb);box-shadow:0 5px 0 #143a8f,0 10px 22px rgba(0,0,0,.35)}
.btn.blue:active:not(:disabled){box-shadow:0 1px 0 #143a8f,0 4px 12px rgba(0,0,0,.35)}
.btn.purple{background:linear-gradient(180deg,#c68cff,#7c3aed);box-shadow:0 5px 0 #46187f,0 10px 22px rgba(0,0,0,.35)}
.btn.purple:active:not(:disabled){box-shadow:0 1px 0 #46187f,0 4px 12px rgba(0,0,0,.35)}
.btn.pink{background:linear-gradient(180deg,#ff7ab0,#e11d64);box-shadow:0 5px 0 #7a0f37,0 10px 22px rgba(0,0,0,.35)}
.btn.pink:active:not(:disabled){box-shadow:0 1px 0 #7a0f37,0 4px 12px rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(180deg,#ffe08a,#f59e0b);color:#3b2400;text-shadow:none;box-shadow:0 5px 0 #8a5a00,0 10px 22px rgba(0,0,0,.35)}
.btn.gold:active:not(:disabled){box-shadow:0 1px 0 #8a5a00,0 4px 12px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:0 3px 0 rgba(0,0,0,.35);border:1px solid var(--line)}
.btn.ghost:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.xs{padding:6px 10px;font-size:12px;border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn.block{width:100%}
.btn.icon{width:44px;height:44px;padding:0;border-radius:14px;font-size:20px}
.btn .price{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.25);border-radius:999px;padding:2px 10px;font-size:14px}
.btn .strike{text-decoration:line-through;opacity:.6;font-size:12px}
.link{background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:8px}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid #1a1240}
.ribbon{position:absolute;top:10px;left:-8px;background:linear-gradient(90deg,#ff3d81,#ff8a1f);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:0 8px 8px 0;box-shadow:0 2px 6px rgba(0,0,0,.4);text-transform:uppercase;letter-spacing:.5px;z-index:1}
.ribbon.gold{background:linear-gradient(90deg,#f59e0b,#ffd166);color:#3b2400}
.ribbon.green{background:linear-gradient(90deg,#16a34a,#4ade80)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;backdrop-filter:blur(6px)}
body.lowfx .card{backdrop-filter:none}
.card.solid{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05))}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 8px;font-weight:700;font-size:14px;line-height:1;height:32px;position:relative}
.pill .plus{width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;line-height:1;margin-left:1px;box-shadow:0 2px 0 #0c5f2b;flex:none}
.pill .sub{font-size:10px;color:var(--muted);font-weight:500;margin-left:2px}
.pill.lives{color:#ff6b8a}
.pill.coins{color:var(--gold)}
.pill.gems{color:var(--gem)}
.bar{position:relative;height:10px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.bar>i{position:absolute;inset:0;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--green2));transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bar.xp>i{background:linear-gradient(90deg,#a855f7,#ec4899)}
.bar.gold>i{background:linear-gradient(90deg,#f59e0b,#ffd166)}
.bar.blue>i{background:linear-gradient(90deg,#2563eb,#67e8f9)}
.bar.lg{height:16px}
.bar .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.rar-common{--rc:var(--c-common)}.rar-rare{--rc:var(--c-rare)}.rar-epic{--rc:var(--c-epic)}.rar-legendary{--rc:var(--c-legendary)}
.rtag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:var(--rc);color:#fff}
.rar-common .rtag{color:#1a1a1a}.rar-legendary .rtag{color:#3b2400}
.topbar{display:flex;align-items:center;gap:6px;padding:10px 10px;flex-wrap:nowrap;min-width:0}
.topbar .pill{flex:1 1 0;justify-content:center;min-width:0;padding:5px 6px 5px 6px;gap:4px}
.topbar .pill span.v{overflow:hidden;text-overflow:ellipsis;font-size:13px}
.topbar .pill .sub{display:none}
.lvl{display:flex;align-items:center;gap:6px;min-width:0;flex:0 0 auto}
.lvl .ring{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--purple2) calc(var(--p,0)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;flex:none}
.lvl .ring b{width:32px;height:32px;border-radius:50%;background:#1a1240;display:grid;place-items:center;font-size:13px}
.lvl .col{display:none}
#scr-loading{align-items:center;justify-content:center;gap:16px;background:radial-gradient(120% 90% at 50% -10%,var(--bg1) 0%,var(--bg2) 70%);z-index:50}
.logo{font-size:clamp(40px,9vw,72px);font-weight:700;letter-spacing:-1px;line-height:.95;text-align:center;background:linear-gradient(180deg,#fff 20%,#ffd166 55%,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(90,20,0,.45)) drop-shadow(0 12px 30px rgba(0,0,0,.5))}
.logo small{display:block;font-size:.42em;letter-spacing:6px;color:#fff;-webkit-text-fill-color:#fff;filter:none;margin-top:6px}
.logo-emoji{font-size:clamp(56px,14vw,110px);animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
#load-bar{width:min(70vw,320px)}
#load-tip{font-size:13px;color:var(--muted);text-align:center;max-width:300px;min-height:2.6em}
#scr-home{display:none}
#scr-home.active{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "mid" "nav"}
.home-top{grid-area:top;min-width:0}
.home-mid{grid-area:mid;position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
.home-nav{grid-area:nav;min-width:0}
#showcase{flex:1 1 auto;min-height:120px;position:relative}
.showcase-caption{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;color:#fff;z-index:2}
.showcase-caption .muted{font-weight:600}
.showcase-caption:empty{display:none}
.rail{position:absolute;top:8px;display:flex;flex-direction:column;gap:14px;z-index:2}
.rail.left{left:10px}.rail.right{right:10px}
.rbtn{position:relative;width:52px;height:52px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.rbtn .ic{font-size:22px;line-height:1}
.rbtn .lb{font-size:8px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.rbtn .tm{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#0d0a24;border:1px solid var(--line);border-radius:999px;font-size:9px;padding:1px 6px;white-space:nowrap;color:var(--gold);font-weight:700}
.rbtn.glow{animation:glowpulse 1.4s ease-in-out infinite;border-color:var(--gold)}
@keyframes glowpulse{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 0 0 rgba(255,209,102,.0)}50%{box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 18px 4px rgba(255,209,102,.55)}}
.home-bottom{padding:6px 12px 8px;display:flex;flex-direction:column;gap:10px}
.hero-card{display:flex;align-items:center;gap:12px;padding:10px 12px}
.hero-card .he{font-size:38px;width:56px;height:56px;display:grid;place-items:center;background:rgba(0,0,0,.3);border-radius:16px;border:2px solid var(--rc,var(--line));flex:none}
.hero-card .hn{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hero-card .hp{font-size:12px;color:var(--muted);margin-top:2px}
.hero-card .lv{font-size:11px;background:rgba(0,0,0,.3);padding:2px 6px;border-radius:6px}
.play-wrap{display:flex;align-items:center;justify-content:center;gap:10px}
.btn.play{padding:16px 44px;font-size:26px;border-radius:24px;letter-spacing:1px;animation:playpulse 1.6s ease-in-out infinite;flex-direction:column;gap:0;line-height:1}
.btn.play small{display:block;font-size:12px;letter-spacing:0;opacity:.9;font-weight:600;margin-top:4px}
body.reduce-motion .btn.play{animation:none}
@keyframes playpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.boost-strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.boost{position:relative;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line);font-size:12px;font-weight:700}
.boost.on{border-color:var(--green2);background:rgba(34,197,94,.2)}
.boost .ic{font-size:18px}
.boost .cnt{color:var(--muted);font-size:11px}
.nav{display:flex;justify-content:space-around;align-items:stretch;padding:6px 4px calc(6px + var(--sab));background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.5));border-top:1px solid var(--line);min-width:0;overflow:hidden}
.nav button{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button .ic{font-size:24px;line-height:1.1;transition:transform .15s}
.nav button:active .ic{transform:scale(.9)}
.nav button .badge{top:0;right:calc(50% - 24px)}
.nav button.hot{color:#fff}
.flash-banner{margin:0 12px;padding:8px 12px;border-radius:14px;background:linear-gradient(90deg,#e11d64,#ff8a1f);display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:13px;font-weight:700;cursor:pointer}
.flash-banner .t{margin-left:auto;background:rgba(0,0,0,.3);padding:3px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
#scr-game{display:none}
#scr-game.active{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto;grid-template-areas:"hud" "meter" "board" "bottom"}
.side{display:none}
.hud{grid-area:hud;display:flex;align-items:center;gap:8px;padding:8px 12px 4px}
.hud .score{flex:1 1 auto;text-align:center}
.hud .score .v{font-size:clamp(28px,7vw,40px);font-weight:700;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.hud .score .b{font-size:11px;color:var(--muted);font-weight:600}
.hud .timer{width:78px;text-align:center}
.hud .timer .v{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.hud .timer.low .v{color:#ff5c7a;animation:tick .5s ease-in-out infinite}
@keyframes tick{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.hud .timer .b{font-size:11px;color:var(--muted)}
.meter-wrap{grid-area:meter;padding:2px 14px 0;display:flex;align-items:center;gap:8px}
.meter-wrap .bl{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--gold)}
.meter{flex:1;height:14px}
.meter>i{background:linear-gradient(90deg,#f59e0b,#ffd166,#fff)}
.meter.full{box-shadow:0 0 16px 2px rgba(255,209,102,.7)}
.meter.full>i{animation:meterflash .3s linear infinite alternate}
@keyframes meterflash{from{filter:brightness(1)}to{filter:brightness(1.6)}}
#board-area{grid-area:board;position:relative;min-height:0}
.gbottom{grid-area:bottom;display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 12px calc(14px + var(--sab))}
.power{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p,0)*1%),rgba(255,255,255,.12) 0);box-shadow:0 6px 0 rgba(0,0,0,.4),0 12px 24px rgba(0,0,0,.4);transition:transform .1s}
.power:active{transform:translateY(3px)}
.power b{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3b2a7a,#1a1240);display:grid;place-items:center;font-size:36px;position:relative}
.power .lb{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;background:#0d0a24;border:1px solid var(--line);padding:2px 8px;border-radius:999px;white-space:nowrap;color:var(--muted)}
.power.ready{animation:readypulse .9s ease-in-out infinite}
.power.ready .lb{color:var(--gold);border-color:var(--gold)}
@keyframes readypulse{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.4),0 0 0 0 rgba(255,209,102,.6)}50%{box-shadow:0 6px 0 rgba(0,0,0,.4),0 0 26px 8px rgba(255,209,102,.5)}}
.gstat{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);gap:2px;min-width:70px}
.gstat b{font-size:18px;color:#fff;font-variant-numeric:tabular-nums}
.gstat .ic{font-size:20px}
#announcer{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:5}
#announcer div{display:inline-block;font-size:clamp(34px,9vw,64px);font-weight:700;letter-spacing:1px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(255,209,102,.6);animation:ann .9s cubic-bezier(.2,.8,.2,1) forwards}
#announcer div.blitz{background:linear-gradient(180deg,#fff,#ffd166,#ff3d81);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:clamp(44px,12vw,90px);text-shadow:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4))}
@keyframes ann{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}45%{transform:scale(1)}80%{opacity:1;transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(1.1) translateY(-40px)}}
.floater{position:absolute;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 10px rgba(0,0,0,.4);transform:translate(-50%,-50%);will-change:transform,opacity;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.floater.big{font-size:28px;color:var(--gold)}
.floater.coin{color:var(--gold)}
.floater.time{color:var(--gem)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

.box-scene{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-height:300px;justify-content:center}

@keyframes boxshake{0%{transform:rotate(-6deg) translateX(-3px)}50%{transform:rotate(6deg) translateX(3px)}100%{transform:rotate(-6deg) translateX(-3px)}}
.reveal{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 16px;border-radius:22px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 55%,#000 0%),#171040 75%);border:2px solid var(--rc);box-shadow:0 0 40px color-mix(in srgb,var(--rc) 60%,transparent);animation:pop .4s cubic-bezier(.34,1.56,.64,1);min-width:200px}

.multi{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

.odds{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}

.toast{background:rgba(13,10,36,.92);border:1px solid var(--line);color:#fff;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);animation:toastin .25s cubic-bezier(.34,1.56,.64,1),toastout .3s ease-in 2s forwards;max-width:92vw}
@keyframes toastin{from{transform:translateY(-20px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes toastout{to{opacity:0;transform:translateY(-10px)}}
#ad{position:absolute;inset:0;display:none;z-index:40;background:#000;flex-direction:column;align-items:center;justify-content:center;color:#fff}

.ad-top{position:absolute;top:calc(var(--sat) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#ccc}

.ad-lbl{position:absolute;bottom:calc(var(--sab) + 12px);font-size:11px;color:#777}
.results{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}

.results .xpw{width:100%;text-align:left;font-size:12px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.checkout{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.checkout .sheet{width:100%;background:#fff;color:#111;border-radius:18px;padding:14px;text-align:left;font-family:-apple-system,system-ui,sans-serif}

.setting{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;gap:10px}
.switch{width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.15);position:relative;transition:background .2s;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--green)}

.seg{display:flex;background:rgba(0,0,0,.3);border-radius:10px;padding:3px}

.seg button.on{background:rgba(255,255,255,.15);color:#fff}
.offer{position:relative;overflow:hidden;background:linear-gradient(160deg,#3b1d8f,#171040);border-color:var(--gold)}

.countdown{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold)}
.lives-opt{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--line);margin:10px 0}
.center-note{text-align:center;font-size:12px;color:var(--muted)}
.pause-grid{display:flex;flex-direction:column;gap:10px}
.eventcard{background:linear-gradient(160deg,#0e7490,#7c3aed);border:0}

.token-track{display:flex;justify-content:space-between;gap:4px;margin-top:8px}
.token-track .m{flex:1;text-align:center;font-size:10px;padding:6px 2px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.token-track .m.got{border-color:var(--green2);opacity:.6}
.token-track .m.avail{border-color:var(--gold);box-shadow:0 0 10px rgba(255,209,102,.6);cursor:pointer}
.token-track .m b{display:block;font-size:14px}
.vip{background:linear-gradient(160deg,#4c1d95,#1e1b4b);border:1px solid var(--gold)}
.vip ul{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;text-align:left}
.vip li::before{content:'✓ ';color:var(--green2);font-weight:700}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}

.stat-grid b{font-variant-numeric:tabular-nums}
.side .card{margin:0 0 10px}
.side h3,.home-side h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px}
.side .lb-row{padding:6px 8px;font-size:13px}
.side .mission{padding:8px 10px}
kbd{background:rgba(255,255,255,.12);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;font-family:inherit}
.home-side{display:none}
@media (min-width:1024px) and (orientation:landscape){
  #scr-home.active{grid-template-columns:minmax(260px,320px) 1fr minmax(260px,320px);grid-template-rows:auto 1fr auto;grid-template-areas:"top top top" "left mid right" "nav nav nav";column-gap:12px;padding-left:calc(var(--sal) + 12px);padding-right:calc(var(--sar) + 12px)}

  .rail{display:none}
  .topbar{gap:8px;padding:10px 12px}

  #scr-game.active{grid-template-columns:minmax(240px,300px) 1fr minmax(240px,300px);grid-template-rows:auto auto 1fr auto;grid-template-areas:"left hud right" "left meter right" "left board right" "left bottom right";column-gap:12px;padding-left:calc(var(--sal) + 12px);padding-right:calc(var(--sar) + 12px)}
  .side{display:flex;flex-direction:column;padding:12px 0;overflow:auto;scrollbar-width:none}
  .side.left{grid-area:left}.side.right{grid-area:right}
  .nav{border-radius:18px 18px 0 0;max-width:640px;margin:0 auto;width:100%}
  .nav button .ic{font-size:26px}
  .hud .score .v{font-size:44px}

}

  .rbtn{width:48px;height:48px;border-radius:14px}.rbtn .ic{font-size:20px}.rbtn .lb{display:none}

/* phone landscape: HUD column left, power column right, board takes the full height */
